<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Host Center | The Real Vacations</title><link rel="icon" href="/favicon.ico"/><style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f7f3fb;color:#30243e}.top{background:#1a0533;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}.top img{height:46px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1100px;margin:32px auto;padding:0 20px 60px}.hero,.card{background:#fff;border:1px solid #e3d9ef;border-radius:18px;padding:22px;margin-bottom:18px}.hero{background:linear-gradient(135deg,#1a0533,#5b21b6);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.btn{background:#7c3aed;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#eee8f6;color:#1a0533}.field{margin:9px 0}.field input,.field textarea{width:100%;padding:10px;border:1px solid #cfc3dc;border-radius:8px;font:inherit}.field textarea{min-height:80px}.muted{color:#756a7e}.record{border:1px solid #e7dff0;border-radius:12px;padding:14px;margin:10px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="top"><a href="/"><img src="/newtrv180x180no bckgrd logo favi.jpg"/></a><a href="/my-trips">Member Home</a></div><main class="wrap"><section class="hero"><h1>TRV Host Center</h1><p>Manage your Host status, membership, trip concepts and earnings.</p></section><div id="app"><p>Loading Host account…</p></div></main>
<script type="module">import{supabase}from'/js/supabase-client.js';const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const{data:{user}}=await supabase.auth.getUser();if(!user){location.replace('/login?next='+encodeURIComponent('/host-center'))}else{const[{data:application},{data:membership},{data:vip},{data:profile},{data:proposals},{data:earnings}]=await Promise.all([supabase.from('host_applications').select('*').eq('user_id',user.id).maybeSingle(),supabase.from('host_memberships').select('*').eq('user_id',user.id).maybeSingle(),supabase.from('vip_memberships').select('status,paid_through,trial_ends_at').eq('user_id',user.id).maybeSingle(),supabase.from('host_profiles').select('*').eq('user_id',user.id).maybeSingle(),supabase.from('host_trip_proposals').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),supabase.from('host_earnings').select('*').eq('host_user_id',user.id).order('created_at',{ascending:false})]);if(!application){app.innerHTML='<section class="card"><h2>You have not applied yet.</h2><p>Start with the TRV Host application.</p><a class="btn" href="/host">Apply to Host</a></section>'}else if(application.status!=='approved'){app.innerHTML='<section class="card"><h2>Application status: '+esc(application.status)+'</h2><p>TRV is reviewing your Host application. Membership billing does not begin until approval.</p></section>'}else{const vipActive=vip&&['active','trialing'].includes(vip.status);const hostActive=membership&&['active','trialing'].includes(membership.status);let gate='';if(!vipActive)gate='<section class="card"><h2>Step 1 — Activate TRV VIP</h2><p>The Host program is an add-on to an active VIP membership.</p><a class="btn" href="/vip">Open VIP Membership</a></section>';else if(!hostActive)gate='<section class="card"><h2>Step 2 — Activate your Host Add-On</h2><p>Approved Host application ✓</p><button class="btn host-plan" data-plan="monthly">$19.99/month</button> <button class="btn host-plan" data-plan="annual">$149.99/year</button><p id="billMsg" class="muted"></p></section>';else gate='<section class="card"><strong>Host membership active ✓</strong>'+(profile?.slug?' · <a href="/hosts/'+encodeURIComponent(profile.slug)+'">View public profile</a>':'')+'</section>';
const proposalBlock=hostActive?'<div class="grid"><section class="card"><h2>Propose a Hosted Trip</h2><form id="proposalForm"><div class="field"><input name="title" required placeholder="Trip concept / title"></div><div class="field"><input name="destination" required placeholder="Destination"></div><div class="field"><input name="preferred_start" type="date"></div><div class="field"><input name="preferred_end" type="date"></div><div class="field"><input name="theme" placeholder="Theme / vibe"></div><div class="field"><input name="audience" placeholder="Who is this for?"></div><div class="field"><input name="expected_travelers" type="number" min="1" placeholder="Expected travelers"></div><div class="field"><textarea name="activities" placeholder="Ideas / activities"></textarea></div><div class="field"><textarea name="notes" placeholder="Anything TRV should know"></textarea></div><button class="btn" type="submit">Submit to TRV</button><p id="proposalMsg" class="muted"></p></form></section><section class="card"><h2>My Trip Concepts</h2>'+(proposals?.length?proposals.map(p=>'<div class="record"><strong>'+esc(p.title)+'</strong><br>'+esc(p.destination)+' · '+esc(p.status)+'</div>').join(''):'<p class="muted">No trip concepts yet.</p>')+'<h2 style="margin-top:26px">Earnings</h2>'+(earnings?.length?earnings.map(e=>'<div class="record">$'+(Number(e.amount_cents||0)/100).toFixed(2)+' · '+esc(e.status)+'</div>').join(''):'<p class="muted">No eligible Host earnings yet.</p>')+'</section></div>':'';
app.innerHTML=gate+proposalBlock;
document.querySelectorAll('.host-plan').forEach(b=>b.onclick=async()=>{b.disabled=true;const{data:{session}}=await supabase.auth.getSession();const r=await fetch('/api/create-host-checkout',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},body:JSON.stringify({plan:b.dataset.plan})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.url){document.getElementById('billMsg').textContent=d.error||'Host checkout could not be started.';b.disabled=false;return}location.assign(d.url)});
document.getElementById('proposalForm')?.addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.currentTarget).entries());const payload={user_id:user.id,status:'submitted',title:v.title.trim(),destination:v.destination.trim(),preferred_start:v.preferred_start||null,preferred_end:v.preferred_end||null,theme:v.theme.trim()||null,audience:v.audience.trim()||null,expected_travelers:v.expected_travelers?Number(v.expected_travelers):null,activities:v.activities.trim()||null,notes:v.notes.trim()||null,submitted_at:new Date().toISOString()};const{error}=await supabase.from('host_trip_proposals').insert(payload);document.getElementById('proposalMsg').textContent=error?error.message:'Trip concept submitted to TRV ✓';if(!error)setTimeout(()=>location.reload(),700)})}}}</script></body></html>

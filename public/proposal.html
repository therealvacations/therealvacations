<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Your Travel Proposal | The Real Vacations</title>
<link rel="icon" href="/favicon.ico"/>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f7f3fb;color:#30243e}
nav{background:#1a0533;padding:14px 28px;display:flex;align-items:center;gap:24px}nav img{height:48px}.nav-logo{margin-right:auto}.nav-links,.nav-auth{display:flex;gap:14px;align-items:center}.nav-links a,.nav-auth a{color:#fff;text-decoration:none;font-size:13px}.nav-auth a:last-child{background:#7c3aed;padding:8px 14px;border-radius:999px}
.hero{background:linear-gradient(135deg,#1a0533,#4c1d6f);color:#fff;padding:58px 22px}.hero-inner{max-width:960px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:#d8b4fe;font-weight:800}.hero h1{font-size:clamp(34px,6vw,58px);margin:10px 0}.hero p{max-width:760px;line-height:1.7;color:#eee2f7;font-size:17px}
.wrap{max-width:960px;margin:auto;padding:36px 20px 70px}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}.pill{background:#eee5f7;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:700}
.option{background:#fff;border:1px solid #e5dcec;border-radius:20px;padding:26px;margin:18px 0;box-shadow:0 10px 30px rgba(55,30,75,.06)}.option.recommended{border:2px solid #7c3aed}.option-top{display:flex;justify-content:space-between;gap:20px;align-items:start}.option h2{color:#1a0533;margin:0 0 9px}.price{font-size:30px;font-weight:900;color:#6d28d9;white-space:nowrap}.desc{color:#6d6273;line-height:1.7}.details{background:#faf7fc;border-radius:12px;padding:16px;margin:18px 0;white-space:pre-line}.deposit{font-weight:700;color:#4b3d56}
.items{display:grid;gap:14px;margin:18px 0}.proposal-item{border:1px solid #eadff2;border-radius:14px;padding:17px;background:#fff}.item-top{display:flex;justify-content:space-between;gap:18px;align-items:start}.item-type{text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:900;color:#7c3aed}.proposal-item h3{margin:4px 0 6px;color:#1a0533}.item-price{font-weight:900;color:#1a0533;white-space:nowrap}.item-desc{color:#6d6273;margin:6px 0}.item-details{margin-top:10px;background:#faf7fc;border-radius:10px;padding:11px;font-size:13px;line-height:1.7}.total-box{border-top:2px solid #ede4f3;margin-top:18px;padding-top:14px}
.builder{background:#fff;border:2px solid #7c3aed;border-radius:20px;padding:26px;margin:18px 0 28px;box-shadow:0 10px 30px rgba(55,30,75,.08)}.builder h2{margin:0 0 8px;color:#1a0533}.builder-group{border-top:1px solid #eadff2;padding:16px 0}.builder-group:first-of-type{border-top:0}.builder-choice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #eadff2;border-radius:11px;margin:8px 0}.builder-choice input{margin-top:4px}.builder-choice strong{color:#1a0533}.builder-total{font-size:26px;font-weight:900;color:#6d28d9}.attachment-grid{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.attachment-link{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid #ded4ed;border-radius:10px;text-decoration:none;color:#4c1d6f;font-weight:700;font-size:13px}.attachment-image{width:150px;height:100px;object-fit:cover;border-radius:10px;border:1px solid #eadff2}
button{border:0;border-radius:999px;background:#7c3aed;color:#fff;padding:13px 22px;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.message{margin-top:10px;color:#991b1b}.loading{text-align:center;padding:70px 20px;color:#6d6273}
.expired{background:#fff3cd;border:1px solid #f4d98a;padding:14px;border-radius:12px;margin-bottom:18px}
@media(max-width:720px){.nav-links{display:none}.option-top{display:block}.price{margin:12px 0}}
</style>
</head>
<body>
<nav>
<a href="/" class="nav-logo"><img src="/newtrv180x180no bckgrd logo favi.jpg" alt="The Real Vacations"></a>
<div class="nav-links"><a href="/">Home</a><a href="/trips">Trips</a><a href="/resources">Resources</a><a href="/contact">Contact</a></div>
<div class="nav-auth"><a href="/my-trips">My Trips</a><a href="/login">Login</a></div>
</nav>
<section class="hero"><div class="hero-inner"><div class="eyebrow">Your Personalized TRV Proposal</div><h1 id="title">Your travel proposal</h1><p id="summary">Loading your personalized travel options…</p></div></section>
<main class="wrap">
<div id="loading" class="loading">Loading your secure proposal…</div>
<div id="content" hidden>
<div class="meta" id="meta"></div>
<div id="expired" class="expired" hidden>This proposal has expired. Contact The Real Vacations for refreshed pricing and availability.</div>
<div id="builder"></div>
<div id="options"></div>
<p class="message" id="message" aria-live="polite"></p>
</div>
</main>
<script type="module">
import { supabase } from '/js/supabase-client.js';
const qs=new URLSearchParams(location.search), quoteId=qs.get('quote')||'';
const loading=document.getElementById('loading'),content=document.getElementById('content'),optionsEl=document.getElementById('options'),builderEl=document.getElementById('builder'),message=document.getElementById('message');
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(n)||0)/100);
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const {data:{user}}=await supabase.auth.getUser();
if(!user){location.replace('/login?next='+encodeURIComponent('/proposal?quote='+quoteId));}
if(user){
  const {data:q,error}=await supabase.from('travel_quotes')
    .select('quote_id,title,summary,status,valid_until,quote_kind,workflow_status,travel_requests!inner(request_id,user_id,request_travelers(first_name,middle_name,last_name,traveler_type)),travel_quote_options(option_id,name,description,total_amount,deposit_amount,is_recommended,details,sort_order,allow_mix_and_match,travel_quote_items(item_id,category,title,description,amount,quantity,sort_order,details,image_url,selection_group,selection_rule,client_visible,attachments,travel_quote_item_variants(variant_id,label,description,amount,sort_order,is_default,active)))')
    .eq('quote_id',quoteId).maybeSingle();
  if(error||!q){loading.textContent='This proposal could not be found for your account.'}
  else{
    const {data:approvedBooking}=await supabase.from('custom_bookings')
      .select('custom_booking_id,balance_due,amount_paid')
      .eq('quote_id',quoteId).maybeSingle();
    document.getElementById('title').textContent=q.title||'Your TRV Proposal';
    document.getElementById('summary').textContent=q.summary||'Review your personalized travel options and select the experience you want to book.';
    const expired=q.valid_until&&new Date(q.valid_until).getTime()<Date.now();
    const requestRow=Array.isArray(q.travel_requests)?q.travel_requests[0]:q.travel_requests;
    const ownsQuote=Boolean(requestRow?.user_id&&requestRow.user_id===user.id);
    document.getElementById('expired').hidden=!expired;
    const meta=[];
    if(q.valid_until) meta.push('<span class="pill">Valid through '+new Date(q.valid_until).toLocaleDateString()+'</span>');
    meta.push('<span class="pill">Status: '+esc(String(q.status||'ready').replaceAll('_',' '))+'</span>');
    document.getElementById('meta').innerHTML=meta.join('');
    const travelers=(requestRow?.request_travelers||[]);
    const travelerHtml=travelers.length?'<section class="option" style="margin-bottom:18px"><h2 style="margin-top:0">Travelers on this proposal</h2><div class="details">'+travelers.map((t,i)=>esc((i+1)+'. '+[t.first_name,t.middle_name,t.last_name].filter(Boolean).join(' ')+(t.traveler_type?' · '+t.traveler_type.replaceAll('_',' '):''))).join('<br>')+'</div></section>':'';
    document.getElementById('options').insertAdjacentHTML('beforebegin',travelerHtml);
    const opts=(q.travel_quote_options||[]).sort((a,b)=>a.sort_order-b.sort_order);
    const allMixItems=opts.flatMap(o=>(o.travel_quote_items||[]).filter(i=>i.client_visible!==false&&i.selection_group&&o.allow_mix_and_match!==false).map(i=>({...i,option_name:o.name})));
    const groups=new Map();
    allMixItems.forEach(i=>{
      const key=String(i.selection_group||'').trim();
      if(!key)return;
      if(!groups.has(key))groups.set(key,{rule:i.selection_rule||'fixed',items:[]});
      const g=groups.get(key);
      if(!g.items.some(x=>x.title===i.title&&x.amount===i.amount&&x.description===i.description))g.items.push(i);
    });
    const canBuild=ownsQuote&&!expired&&['ready','viewed'].includes(q.status)&&q.quote_kind!=='custom_selection'&&groups.size>0;
    if(canBuild){
      const groupHtml=[...groups.entries()].map(([name,g])=>{
        const safe='grp-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
        if(g.rule==='fixed'){
          const i=g.items[0];
          return '<div class="builder-group" data-group="'+esc(name)+'"><strong>'+esc(name.replaceAll('_',' '))+' · Required</strong><label class="builder-choice"><input class="mix-choice" type="radio" name="'+esc(safe)+'" value="'+i.item_id+'" checked><span><strong>'+esc(i.title)+'</strong><br><small>'+esc(i.option_name||'')+(i.amount!=null?' · '+money(i.amount):'')+'</small></span></label></div>';
        }
        const none=g.rule==='optional'?'<label class="builder-choice"><input class="mix-choice" type="radio" name="'+esc(safe)+'" value="" checked><span><strong>No extra</strong></span></label>':'';
        return '<div class="builder-group" data-group="'+esc(name)+'"><strong>'+esc(name.replaceAll('_',' '))+(g.rule==='choose_one'?' · Choose one':' · Optional')+'</strong>'+none+g.items.map((i,idx)=>'<label class="builder-choice"><input class="mix-choice" type="radio" name="'+esc(safe)+'" value="'+i.item_id+'" '+(g.rule==='choose_one'&&idx===0?'checked':'')+'><span><strong>'+esc(i.title)+'</strong><br><small>'+esc(i.option_name||'')+(i.amount!=null?' · '+money(i.amount):'')+'</small></span></label>').join('')+'</div>';
      }).join('');
      builderEl.innerHTML='<section class="builder"><div class="eyebrow" style="color:#7c3aed">Build Your Trip</div><h2>Mix & match the choices you want</h2><p class="desc">Shared items stay locked. Choose one package where TRV has given you alternatives. Your selection creates a new quote for TRV to verify before you approve or pay.</p>'+groupHtml+'<div class="total-box"><div class="option-top"><strong>Your selected trip</strong><div class="builder-total" id="mixTotal">$0.00</div></div><div class="field" style="margin-top:12px"><label for="mixNote" style="display:block;font-size:12px;font-weight:800;margin-bottom:6px">Note for TRV (optional)</label><textarea id="mixNote" style="width:100%;min-height:70px;border:1px solid #ded4ed;border-radius:10px;padding:10px" placeholder="Anything you want us to verify or adjust?"></textarea></div><button id="submitMixSelection" type="button">Submit My Selection</button><p class="deposit" style="margin-bottom:0">TRV will verify live pricing and availability before this becomes your final quote.</p></div></section>';
      const byId=new Map(allMixItems.map(i=>[i.item_id,i]));
      const updateMixTotal=()=>{
        const ids=[...document.querySelectorAll('.mix-choice:checked')].map(x=>x.value).filter(Boolean);
        const chosen=ids.map(id=>byId.get(id)).filter(Boolean);
        const subtotal=chosen
          .filter(i=>String(i.category||'').toLowerCase()!=='processing_fee'&&!/processing convenience fee/i.test(String(i.title||'')))
          .reduce((sum,i)=>sum+(Number(i.amount)||0),0);
        const total=subtotal+Math.round(subtotal*0.035);
        const totalEl=document.getElementById('mixTotal'); if(totalEl)totalEl.textContent=money(total);
      };
      document.querySelectorAll('.mix-choice').forEach(x=>x.addEventListener('change',updateMixTotal));
      updateMixTotal();
      document.getElementById('submitMixSelection')?.addEventListener('click',async()=>{
        const button=document.getElementById('submitMixSelection');
        const ids=[...document.querySelectorAll('.mix-choice:checked')].map(x=>x.value).filter(Boolean);
        button.disabled=true;button.textContent='Submitting for TRV review…';message.textContent='';
        const {data:{session}}=await supabase.auth.getSession();
        if(!session?.access_token){location.replace('/login?next='+encodeURIComponent('/proposal?quote='+quoteId));return;}
        try{
          const resp=await fetch('/api/submit-quote-selection',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},body:JSON.stringify({quote_id:quoteId,selected_item_ids:ids,note:document.getElementById('mixNote')?.value||''})});
          const result=await resp.json().catch(()=>({}));
          if(!resp.ok)throw new Error(result.error||'Your selection could not be submitted.');
          builderEl.innerHTML='<section class="builder"><h2>Selection received</h2><p class="desc">We’re confirming current availability and pricing. Your finalized TRV quote will appear here when ready.</p><p class="deposit">Submitted total: '+money(result.total_amount)+'</p><a class="attachment-link" href="/my-trips">Return to My Trips →</a></section>';
        }catch(error){
          message.textContent=error.message||'Your selection could not be submitted.';
          button.disabled=false;button.textContent='Submit My Selection';
        }
      });
    }else builderEl.innerHTML='';

    optionsEl.innerHTML=opts.map(o=>{
      const items=(o.travel_quote_items||[]).filter(i=>i.client_visible!==false).sort((a,b)=>a.sort_order-b.sort_order);
      const itemsHtml=items.length?'<div class="items">'+items.map(i=>{
        const detailHtml=i.details&&Object.keys(i.details).length?'<div class="item-details">'+Object.entries(i.details).map(([k,v])=>'<div><strong>'+esc(k)+':</strong> '+esc(v)+'</div>').join('')+'</div>':'';
        const imageHtml=i.image_url?'<img src="'+esc(i.image_url)+'" alt="'+esc(i.title||'Travel proposal item')+'" style="width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin:12px 0">':'';
        const attachments=(Array.isArray(i.attachments)?i.attachments:[]).map(a=>a.type==='image'
          ? '<a href="'+esc(a.url)+'" target="_blank" rel="noopener"><img class="attachment-image" src="'+esc(a.url)+'" alt="'+esc(a.name||'Quote image')+'"></a>'
          : '<a class="attachment-link" href="'+esc(a.url)+'" target="_blank" rel="noopener">📄 '+esc(a.name||'View PDF')+'</a>').join('');
        const attachmentHtml=attachments?'<div class="attachment-grid">'+attachments+'</div>':'';
        const variants=(i.travel_quote_item_variants||[]).filter(v=>v.active!==false).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
        const chosenDefault=variants.find(v=>v.is_default)||variants[0];
        const variantHtml=variants.length?'<div class="item-details" style="margin-top:12px"><strong>Choose your option</strong>'+variants.map(v=>'<label class="builder-choice" style="margin-top:8px"><input class="item-variant-choice" type="radio" name="variant-'+esc(o.option_id)+'-'+esc(i.item_id)+'" data-option="'+esc(o.option_id)+'" data-item="'+esc(i.item_id)+'" data-amount="'+Number(v.amount||0)+'" value="'+esc(v.variant_id)+'" '+(chosenDefault?.variant_id===v.variant_id?'checked':'')+'><span><strong>'+esc(v.label)+'</strong> · '+money(v.amount)+(v.description?'<br><small>'+esc(v.description)+'</small>':'')+'</span></label>').join('')+'</div>':'';
        const displayed=variants.length?(chosenDefault?money(chosenDefault.amount):'Choose an option'):(i.amount==null?'Price pending':money(i.amount));
        const processing=String(i.category||'').toLowerCase()==='processing_fee'||/processing convenience fee/i.test(String(i.title||''));
        return '<section class="proposal-item" data-item="'+esc(i.item_id)+'"><div class="item-top"><div><div class="item-type">'+esc(String(i.category||'other').replaceAll('_',' '))+'</div><h3>'+esc(i.title)+'</h3></div><div class="item-price '+(processing?'processing-price':'')+'" data-option="'+esc(o.option_id)+'" data-item="'+esc(i.item_id)+'">'+displayed+'</div></div>'+imageHtml+'<p class="item-desc">'+esc(i.description||'')+'</p>'+variantHtml+detailHtml+attachmentHtml+'</section>';
      }).join('')+'</div>':'';
      const legacyDetails=!items.length&&o.details&&Object.keys(o.details).length?'<div class="details">'+esc(Object.entries(o.details).map(([k,v])=>k+': '+(Array.isArray(v)?v.join(', '):v)).join('\n'))+'</div>':'';
      const canApprove=ownsQuote&&!expired&&['ready','viewed'].includes(q.status);
      const previewOnly=!ownsQuote?'<p class="deposit" style="margin-top:14px">Preview only — booking must be completed while signed in to the traveler account that owns this proposal.</p>':'';
      const approvalBlock=canApprove?'<div style="margin-top:18px;padding:16px;border:1px solid #e7deef;border-radius:14px;background:#faf7fc"><label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45"><input class="review-confirm" type="checkbox" style="margin-top:3px"><span>I reviewed the full proposal details and understand that continuing will approve this option and create my booking.</span></label><button class="choose" data-option="'+o.option_id+'" disabled style="margin-top:12px">Approve & Continue to Booking</button></div>':(approvedBooking&&approvedBooking.custom_booking_id&&approvedBooking.balance_due>0?'<div style="margin-top:18px;padding:16px;border:1px solid #e7deef;border-radius:14px;background:#faf7fc"><p class="deposit" style="margin:0 0 10px">This option is already approved. You can still review every detail here before paying.</p><a href="/quote-checkout?booking='+encodeURIComponent(approvedBooking.custom_booking_id)+'" style="display:inline-block;background:#7c3aed;color:#fff;text-decoration:none;padding:13px 22px;border-radius:999px;font-weight:800">Continue to Payment →</a></div>':'');
      return '<article class="option '+(o.is_recommended?'recommended':'')+'"><div class="option-top"><div><h2>'+esc(o.name)+(o.is_recommended?' · Recommended':'')+'</h2><p class="desc">'+esc(o.description||'')+'</p></div></div>'+itemsHtml+legacyDetails+'<div class="total-box"><div class="option-top"><strong>Proposal Total</strong><div class="price option-total" data-option="'+o.option_id+'">'+money(o.total_amount)+'</div></div>'+(o.deposit_amount?'<p class="deposit">Deposit to book: '+money(o.deposit_amount)+'</p>':'')+'</div>'+previewOnly+approvalBlock+'</article>';
    }).join('');
    loading.hidden=true;content.hidden=false;

    const recalcOptionTotal=optionId=>{
      const option=opts.find(x=>x.option_id===optionId); if(!option)return 0;
      const items=(option.travel_quote_items||[]).filter(i=>i.client_visible!==false);
      let subtotal=0;
      items.forEach(i=>{
        const processing=String(i.category||'').toLowerCase()==='processing_fee'||/processing convenience fee/i.test(String(i.title||''));
        if(processing)return;
        const variants=(i.travel_quote_item_variants||[]).filter(v=>v.active!==false);
        if(variants.length){
          const selected=document.querySelector('.item-variant-choice[data-option="'+optionId+'"][data-item="'+i.item_id+'"]:checked');
          subtotal+=Number(selected?.dataset.amount||0);
          const price=document.querySelector('.item-price[data-option="'+optionId+'"][data-item="'+i.item_id+'"]');
          if(price&&selected)price.textContent=money(Number(selected.dataset.amount||0));
        }else subtotal+=Number(i.amount||0);
      });
      const fee=Math.round(subtotal*0.035), total=subtotal+fee;
      const feeEl=document.querySelector('.processing-price[data-option="'+optionId+'"]'); if(feeEl)feeEl.textContent=money(fee);
      const totalEl=document.querySelector('.option-total[data-option="'+optionId+'"]'); if(totalEl)totalEl.textContent=money(total);
      return total;
    };
    document.querySelectorAll('.item-variant-choice').forEach(x=>x.addEventListener('change',()=>recalcOptionTotal(x.dataset.option)));
    opts.forEach(o=>recalcOptionTotal(o.option_id));

    document.querySelectorAll('.review-confirm').forEach(box=>box.addEventListener('change',()=>{const btn=box.closest('div').querySelector('.choose');if(btn)btn.disabled=!box.checked;}));
    document.querySelectorAll('.choose').forEach(btn=>btn.addEventListener('click',async()=>{
      document.querySelectorAll('.choose').forEach(b=>b.disabled=true);
      btn.textContent='Creating your itinerary…';message.textContent='';
      const {data:{user:activeUser}}=await supabase.auth.getUser();
      if(!activeUser){
        location.replace('/login?next='+encodeURIComponent('/proposal?quote='+quoteId));
        return;
      }
      const selectedVariantIds=[...document.querySelectorAll('.item-variant-choice[data-option="'+btn.dataset.option+'"]:checked')].map(x=>x.value).filter(Boolean);
      const {data:{session}}=await supabase.auth.getSession();
      if(!session?.access_token){location.replace('/login?next='+encodeURIComponent('/proposal?quote='+quoteId));return;}
      let result={};
      try{
        const resp=await fetch('/api/approve-quote-option',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},body:JSON.stringify({quote_id:quoteId,option_id:btn.dataset.option,selected_variant_ids:selectedVariantIds})});
        result=await resp.json().catch(()=>({}));
        if(!resp.ok)throw new Error(result.error||'Your selection could not be completed.');
      }catch(error){
        message.textContent=error.message||'Your selection could not be completed. Please try again.';
        document.querySelectorAll('.choose').forEach(b=>b.disabled=false);btn.textContent='Approve & Continue to Booking';return;
      }
      if(!result.booking_id){
        message.textContent='Your approval was saved, but the booking record could not be opened. Refresh this page or open My Trips.';
        document.querySelectorAll('.choose').forEach(b=>b.disabled=false);btn.textContent='Approve & Continue to Booking';return;
      }
      location.assign('/quote-checkout?booking='+encodeURIComponent(result.booking_id));
    }));
  }
}
</script>
<script type="module" src="/js/site-settings.js"></script>
</body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Request Received | The Real Vacations</title>
  <meta name="description" content="Your travel request has been received by The Real Vacations."/>
  <link rel="icon" href="/favicon.ico"/>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f7f3fb;color:#2d2038}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:32px}
    .card{max-width:720px;background:#fff;border:1px solid #e8dff0;border-radius:24px;padding:42px;box-shadow:0 18px 45px rgba(45,24,74,.09);text-align:center}
    h1{margin:0 0 14px;color:#1a0533;font-size:clamp(30px,6vw,48px)}
    p{line-height:1.7;color:#665a70}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
    a{display:inline-block;text-decoration:none;border-radius:999px;padding:12px 22px;font-weight:800}
    .primary{background:#7c3aed;color:#fff}.secondary{background:#efe8f7;color:#1a0533}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div style="font-size:44px">💜</div>
      <h1 id="requestTitle">Your TRV request was received.</h1>
      <div id="requestBody">
        <p>Your request is now in the TRV system for review.</p>
      </div>
      <div class="btns">
        <a class="primary" id="requestPrimary" href="/trips">Explore Group Trips</a>
        <a class="secondary" id="requestSecondary" href="/resources">Open the Travel Toolkit</a>
      </div>
    </section>
  </main>
<script>
(function(){
  var mode=new URLSearchParams(location.search).get('mode')||'inquiry';
  var title=document.getElementById('requestTitle');
  var body=document.getElementById('requestBody');
  var primary=document.getElementById('requestPrimary');
  var secondary=document.getElementById('requestSecondary');
  if(mode==='secured'){
    title.textContent='Your TRV travel request is secured.';
    body.innerHTML='<p>The planning is moving now. Your request is with The Real Vacations and is <strong>awaiting live supplier confirmation</strong>.</p><p>We’ll confirm availability and final details with the applicable airline, hotel or resort, rental-car company, cruise line, attraction, or other supplier. Once confirmed, TRV will complete the authorized next steps and send your official confirmation details.</p><p style="font-size:13px;color:#85778f"><strong>Important:</strong> Individual supplier reservations are not confirmed until you receive written confirmation from The Real Vacations.</p>';
    primary.href='/my-trips';primary.textContent='Open My TRV Account';
    secondary.href='/request-travel';secondary.textContent='View Request Travel';
  }else{
    title.textContent='TRV received your planning request.';
    body.innerHTML='<p>Your information has been saved in the TRV system for review and proposal development.</p><p>TRV will follow up using the contact details you provided. This submission is a planning inquiry and is <strong>not yet a confirmed supplier reservation</strong>.</p><p style="font-size:13px;color:#85778f">If you create a TRV account using the same email address, this request will attach to your account automatically.</p>';
    primary.href='/signup';primary.textContent='Create My TRV Account';
    secondary.href='/trips';secondary.textContent='Explore Group Trips';
  }
})();
</script>
</body>
</html>

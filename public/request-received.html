<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Request Received | The Real Vacations</title>
  <meta name="description" content="Your travel request has been received by The Real Vacations."/>
  <link rel="icon" href="/favicon.ico"/>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f7f3fb;color:#2d2038}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:32px}
    .card{max-width:720px;background:#fff;border:1px solid #e8dff0;border-radius:24px;padding:42px;box-shadow:0 18px 45px rgba(45,24,74,.09);text-align:center}
    h1{margin:0 0 14px;color:#1a0533;font-size:clamp(30px,6vw,48px)}
    p{line-height:1.7;color:#665a70}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
    a{display:inline-block;text-decoration:none;border-radius:999px;padding:12px 22px;font-weight:800}
    .primary{background:#7c3aed;color:#fff}.secondary{background:#efe8f7;color:#1a0533}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div style="font-size:44px">💜</div>
      <h1>Your request is in.</h1>
      <p>You bring the people you love. We’ll help turn the time you have together into something worth remembering.</p>
      <p>Our travel team will review the details you shared and follow up with next steps.</p>
      <div class="btns">
        <a class="primary" href="/trips">Explore Group Trips</a>
        <a class="secondary" href="/resources">Open the Travel Toolkit</a>
      </div>
    </section>
  </main>
</body>
</html>

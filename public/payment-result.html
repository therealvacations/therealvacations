<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payment Status | The Real Vacations</title><link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#30243e;font-family:'DM Sans',sans-serif}.card{max-width:620px;margin:12vh auto;background:#fff;border-radius:18px;padding:38px;text-align:center;box-shadow:0 3px 18px rgba(35,12,61,.1)}h1{color:#1a0533}.icon{font-size:48px}.btn{display:inline-block;background:#7c3aed;color:#fff;text-decoration:none;border-radius:50px;padding:12px 24px;font-weight:700;margin-top:14px}</style>
</head>
<body><main class="card"><div class="icon" id="icon">✓</div><h1 id="title">Payment submitted</h1><p id="detail">Stripe is securely confirming your payment. Your portal will show the result as soon as the signed confirmation reaches us.</p><a class="btn" href="/my-trips">View My Trips</a></main>
<script>if(new URLSearchParams(location.search).get('status')==='cancelled'){document.getElementById('icon').textContent='↩';document.getElementById('title').textContent='Checkout cancelled';document.getElementById('detail').textContent='No new payment was completed. You can return to My Trips whenever you are ready.'}</script>
</body></html>

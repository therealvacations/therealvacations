<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flight Tickets | The Real Vacations</title>
  <meta name="description" content="Book cheap flights for your group trip with The Real Vacations. Search hundreds of airlines and find the best fares."/>
  <link rel="icon" href="/favicon.ico"/>
  <meta property="og:title" content="Flight Tickets - The Real Vacations"/>
  <meta property="og:description" content="Book cheap flights for your group trip. Search and compare flights instantly."/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;color:#222;background:#fff}
    a{color:inherit;text-decoration:none}
    nav{background:#1a0533;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:100}
    nav a{color:#fff;font-size:14px;font-weight:500}
    nav a:hover{color:#c084fc}
    .nav-logo img{height:40px}
    .nav-links{display:flex;gap:20px;flex-wrap:wrap}
    .nav-auth a{background:#7c3aed;color:#fff;padding:7px 16px;border-radius:20px;font-size:13px;margin-left:8px}
    .flights-hero{background:linear-gradient(135deg,#1a0533 0%,#3b1066 60%,#7c3aed 100%);color:#fff;padding:48px 24px 32px;text-align:center}
    .flights-hero h1{font-size:clamp(28px,4vw,44px);font-weight:800;margin-bottom:12px}
    .flights-hero p{font-size:16px;opacity:.85;max-width:600px;margin:0 auto}
    .flights-container{max-width:1200px;margin:0 auto;padding:40px 24px}
    footer{background:#1a0533;color:#fff;padding:48px 24px 24px}
    .footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;max-width:960px;margin:0 auto 32px}
    @media(max-width:640px){.footer-grid{grid-template-columns:1fr}}
    footer h4{font-size:14px;font-weight:700;margin-bottom:14px;color:#c084fc}
    footer a{color:rgba(255,255,255,.7);font-size:13px;display:block;margin-bottom:8px}
    footer a:hover{color:#fff}
    .footer-bottom{text-align:center;font-size:12px;color:rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.1);padding-top:20px;max-width:960px;margin:0 auto}
    .tpwl-logo-header{background:#f5f5f5;padding:24px;text-align:center}
    .tpwl-search-header{background:#f5f5f5;padding:24px;position:sticky;top:65px;z-index:99}
    .tpwl-main{background:#fff}
    .tpwl-tickets__wrapper, .tpwl-widgets__wrapper, .tpwl-footer__wrapper{padding:0}
    .tpwl__content{max-width:1200px;margin:0 auto;padding:0 24px}
    .tpwl-widget-weedles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:40px 24px}
  </style>
</head>
<body>

<!-- NAV_PLACEHOLDER -->

<div class="flights-hero">
  <h1>Find Your Flight</h1>
  <p>Search hundreds of airlines and book the best fares for your group trip</p>
</div>

<div class="flights-container">
  <header class="tpwl-logo-header">
    <div style="font-size:24px;font-weight:600;color:#1a0533">✈️ Flight Tickets</div>
  </header>
  
  <header class="tpwl-search-header">
    <div class="tpwl__content">
      <div id="tpwl-search"></div>
    </div>
  </header>

  <main class="tpwl-main">
    <div class="tpwl-tickets__wrapper">
      <div class="tpwl__content">
        <div id="tpwl-tickets"></div>
      </div>
    </div>

    <div class="tpwl-widgets__wrapper">
      <div class="tpwl__content">
        <h3 style="text-align:center;font-size:28px;margin-bottom:32px;color:#1a0533">Popular Destinations</h3>
        <div id="tpwl-widget-weedles" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px">
          <div class="tpwl-widget-weedle" data-destination="ORD" is="weedle"></div>
          <div class="tpwl-widget-weedle" data-destination="LAX" is="weedle"></div>
          <div class="tpwl-widget-weedle" data-destination="LAS" is="weedle"></div>
          <div class="tpwl-widget-weedle" data-destination="NYC" is="weedle"></div>
          <div class="tpwl-widget-weedle" data-destination="MIA" is="weedle"></div>
          <div class="tpwl-widget-weedle" data-destination="DEN" is="weedle"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="tpwl-cookie-banner"></div>
</div>

<!-- FOOTER_PLACEHOLDER -->

<!-- Travelpayouts Scripts -->
<script>
  (function () {
    const container = document.getElementById('tpwl-widget-weedles');
    if (!container) return;
    const weedleElements = container.querySelectorAll('div[is="weedle"]');

    weedleElements.forEach(element => {
      if (!TPWL_EXTRA) return;
      const destination = element.getAttribute('data-destination');
      const scriptElement = document.createElement('script');
      scriptElement.async = 1;
      scriptElement.src = `https://[:widget_domain:]/content?currency=${String(TPWL_EXTRA.currency).toLowerCase()}&trs=${TPWL_EXTRA.trs}&shmarker=${TPWL_EXTRA.marker}&destination=${destination}&target_host=${TPWL_EXTRA.domain}&locale=${TPWL_EXTRA.locale}&limit=6&powered_by=false&primary=%23${TPWL_EXTRA.link_color}&promo_id=4044&campaign_id=100`;
      element.appendChild(scriptElement);
    });
  })();
</script>
[:embed_script:]
[:cookie_policy_script:]

</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>TRV Host | The Real Vacations</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f7f3fb;color:#30243e}.wrap{max-width:850px;margin:50px auto;padding:20px}.card{background:#fff;border:1px solid #e3d9ef;border-radius:22px;padding:30px}.badge{display:inline-block;background:#ede9fe;color:#5b21b6;padding:6px 10px;border-radius:999px;font-weight:800}.btn{display:inline-block;background:#7c3aed;color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:800}</style></head><body><main class="wrap"><div id="host" class="card">Loading host…</div></main><script type="module">import{supabase}from'/js/supabase-client.js';const slug=location.pathname.split('/').filter(Boolean).pop();const box=document.getElementById('host');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const{data:h}=await supabase.from('host_profiles').select('*').eq('slug',slug).eq('public_profile',true).maybeSingle();if(!h)box.innerHTML='<h1>Host profile not found.</h1><a class="btn" href="/host">TRV Host Program</a>';else box.innerHTML=(h.avatar_url?'<img src="'+esc(h.avatar_url)+'" alt="" style="width:120px;height:120px;border-radius:50%;object-fit:cover">':'')+'<h1>'+esc(h.display_name)+'</h1>'+(h.verified?'<span class="badge">Verified TRV Host</span>':'')+'<p>'+esc(h.city||'')+'</p><p>'+esc(h.bio||'')+'</p>'+(h.destination_specialties?'<h3>Travel specialties</h3><p>'+esc(h.destination_specialties)+'</p>':'')+'<p>Trips hosted: '+Number(h.trips_hosted||0)+' · Travelers hosted: '+Number(h.travelers_hosted||0)+'</p><a class="btn" href="/trips">Explore TRV Trips</a>';</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Supplier Portal | The Real Vacations</title><link rel="icon" href="/favicon.ico"/>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f6f4f8;color:#251b30}
nav{background:#1a0533;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}nav img{height:44px}nav button{background:transparent;color:#fff;border:1px solid #a78bfa;border-radius:999px;padding:8px 14px;cursor:pointer}
.wrap{max-width:1100px;margin:32px auto;padding:0 20px 60px}.hero{background:#fff;border:1px solid #ded4ed;border-radius:18px;padding:24px;margin-bottom:20px}.hero h1{margin:0 0 8px;color:#1a0533}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid #ded4ed;border-radius:18px;padding:20px}.muted{color:#776b82}.record{border:1px solid #e8e1ef;border-radius:12px;padding:15px;margin-top:12px}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee8f6;font-size:12px;font-weight:700}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head>
<body><nav><a href="/"><img src="/newtrv180x180no bckgrd logo favi.jpg" alt="The Real Vacations"/></a><button id="logout" type="button">Sign out</button></nav>
<main class="wrap">
  <section class="hero"><h1>TRV Supplier Portal</h1><p id="welcome" class="muted">Checking your supplier access…</p></section>
  <div class="grid">
    <section class="card"><h2>Your Supplier Profile</h2><div id="profile"><p class="muted">Loading profile…</p></div></section>
    <section class="card"><h2>Your TRV Assignments</h2><div id="assignments"><p class="muted">Loading assignments…</p></div></section>
  </div>
</main>
<script type="module">
import { supabase } from '/js/supabase-client.js';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(v)||0)/100);
const {data:{user}}=await supabase.auth.getUser();
if(!user){location.replace('/login?next='+encodeURIComponent('/supplier-portal'));} else {
  const {data:supplier,error}=await supabase.from('suppliers').select('*').eq('auth_user_id',user.id).maybeSingle();
  if(error||!supplier){
    document.getElementById('welcome').textContent='This TRV account is not connected to a supplier profile.';
    document.getElementById('profile').innerHTML='<p class="muted">Contact The Real Vacations if you believe you should have supplier access.</p>';
    document.getElementById('assignments').innerHTML='';
  } else {
    document.getElementById('welcome').textContent='Welcome, '+(supplier.display_name||supplier.company_name)+'.';
    document.getElementById('profile').innerHTML=
      '<div class="record"><strong>'+esc(supplier.company_name)+'</strong><br>'+
      (supplier.contact_name?esc(supplier.contact_name)+'<br>':'')+
      (supplier.contact_email?esc(supplier.contact_email)+'<br>':'')+
      (supplier.contact_phone?esc(supplier.contact_phone)+'<br>':'')+
      (supplier.website_url?'<a href="'+esc(supplier.website_url)+'" target="_blank" rel="noopener">Website ↗</a><br>':'')+
      '<span class="status">'+esc(supplier.status)+'</span></div>';

    const {data:rows,error:rowsError}=await supabase.from('supplier_assignments')
      .select('*').eq('supplier_id',supplier.supplier_id).eq('visible_to_supplier',true).order('created_at',{ascending:false});
    if(rowsError){document.getElementById('assignments').innerHTML='<p class="muted">Assignments could not be loaded.</p>';}
    else if(!rows?.length){document.getElementById('assignments').innerHTML='<p class="muted">No assignments have been shared with you yet.</p>';}
    else {
      document.getElementById('assignments').innerHTML=rows.map(r=>
        '<form class="record supplier-assignment-form" data-id="'+r.assignment_id+'"><strong>'+esc(r.service_type||'Supplier assignment')+'</strong><br>'+
        (r.description?'<span>'+esc(r.description)+'</span><br>':'')+
        '<span>Supplier amount: '+money(r.supplier_subtotal)+'</span>'+
        (r.taxes_fees?'<br><span>Taxes/fees: '+money(r.taxes_fees)+'</span>':'')+
        '<div class="field"><label>Status</label><select name="status"><option value="planned">Planned</option><option value="quoted">Quoted</option><option value="confirmed">Confirmed</option><option value="paid">Paid</option><option value="cancelled">Cancelled</option></select></div>'+
        '<div class="field"><label>Confirmation details / number</label><textarea name="confirmation_details" placeholder="Confirmation number, ticket/reference details, supplier confirmation notes...">'+esc(r.confirmation_details||'')+'</textarea></div>'+
        '<div class="field"><label>Supplier reference</label><input name="supplier_reference" value="'+esc(r.supplier_reference||'')+'" placeholder="Supplier cart, reservation, invoice, or booking reference"></div>'+
        '<button type="submit">Save Assignment Update</button><p class="muted save-msg"></p>'+
        '</form>'
      ).join('');
      rows.forEach(r=>{const form=document.querySelector('.supplier-assignment-form[data-id="'+r.assignment_id+'"]');if(form)form.elements.status.value=r.status||'planned';});
      document.querySelectorAll('.supplier-assignment-form').forEach(form=>form.addEventListener('submit',async e=>{
        e.preventDefault();const btn=form.querySelector('button'),msg=form.querySelector('.save-msg');btn.disabled=true;msg.textContent='Saving…';
        const {data:{session}}=await supabase.auth.getSession();
        const values=Object.fromEntries(new FormData(form).entries());
        const response=await fetch('https://lqdflvnkiskzmvvknmmh.supabase.co/functions/v1/supplier-update-assignment',{
          method:'POST',
          headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},
          body:JSON.stringify({assignment_id:form.dataset.id,status:values.status,confirmation_details:values.confirmation_details,supplier_reference:values.supplier_reference})
        });
        const data=await response.json().catch(()=>({}));
        msg.textContent=response.ok?'Saved ✓':(data.error||'Update could not be saved.');
        btn.disabled=false;
      }));
    }
  }
}
document.getElementById('logout').addEventListener('click',async()=>{await supabase.auth.signOut();location.replace('/');});
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TRV VIP | The Real Vacations</title><link rel="icon" href="/favicon.ico"/>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f7f3fb;color:#30243e}
nav{background:#1a0533;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}nav img{height:48px}nav a{color:#fff;text-decoration:none;font-weight:700}
.wrap{max-width:1100px;margin:36px auto;padding:0 18px 60px}.hero{background:linear-gradient(135deg,#1a0533,#5b21b6);color:#fff;border-radius:24px;padding:34px;margin-bottom:26px}
.hero h1{margin:0 0 10px;font-size:38px}.hero p{max-width:760px;line-height:1.6;color:#e9ddf7}
.status{margin-top:18px;display:inline-block;background:rgba(255,255,255,.12);padding:9px 14px;border-radius:999px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:#fff;border:1px solid #e6dff0;border-radius:18px;padding:20px;box-shadow:0 10px 24px rgba(42,22,65,.06)}
.card h3{margin:0 0 8px;color:#1a0533}.card p{color:#6f6578;line-height:1.5}.price{font-size:20px;font-weight:800;color:#7c3aed}
.btn{display:inline-block;margin-top:12px;background:#7c3aed;color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:800}.muted{color:#6f6578}
.locked{text-align:center;background:#fff;border:1px solid #e6dff0;border-radius:18px;padding:32px}
</style></head>
<body><nav><a href="/"><img src="/logo.jpeg" alt="The Real Vacations"/></a><a href="/my-trips">My Trips</a></nav>
<main class="wrap"><section class="hero"><h1>TRV VIP</h1><p>Private travel perks, limited-time offers, member-only experiences, and handpicked extras for travelers who want more from every escape.</p><div class="status" id="vipStatus">Checking membership…</div></section><section id="content"><p class="muted">Loading VIP access…</p></section></main>
<script type="module">
import { supabase } from '/js/supabase-client.js';
const {data:{user}}=await supabase.auth.getUser();
if(!user) location.replace('/login?next='+encodeURIComponent('/vip'));
const statusEl=document.getElementById('vipStatus'),content=document.getElementById('content');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
if(user){
  const {data:membership}=await supabase.from('vip_memberships').select('*').eq('user_id',user.id).maybeSingle();
  const active=membership && ((membership.status==='trialing'&&membership.trial_ends_at&&new Date(membership.trial_ends_at)>new Date()) || (membership.status==='active'&&(!membership.paid_through||new Date(membership.paid_through)>new Date())));
  if(!active){
    statusEl.textContent='Choose your VIP plan';
    content.innerHTML='<div class="grid">'+
      '<article class="card"><small>MONTHLY</small><h3>TRV VIP Monthly</h3><div class="price">$15.99/month</div><p>Private travel offers, member-only perks, popup opportunities, VIP travel content, and your TRV welcome travel/lifestyle item when your paid membership begins.</p><button class="btn join-vip" data-plan="monthly" type="button" style="border:0;cursor:pointer">Join Monthly →</button></article>'+
      '<article class="card"><small>ANNUAL</small><h3>TRV VIP Annual</h3><div class="price">$129.99/year</div><p>Everything in TRV VIP for a full year, plus your TRV welcome travel/lifestyle item when your paid membership begins.</p><button class="btn join-vip" data-plan="annual" type="button" style="border:0;cursor:pointer">Join Annual →</button></article>'+
      '<article class="card"><small>WELCOME GIFT</small><h3>A little TRV for the road.</h3><p>Every new paid VIP member receives a branded TRV / The Real Vacations travel or lifestyle item. Your welcome item may be a T-shirt, hat, cup or tumbler, or another nice TRV-branded item. The item varies.</p></article>'+
      '</div>';
    document.querySelectorAll('.join-vip').forEach(button=>button.addEventListener('click',async()=>{button.disabled=true;button.textContent='Opening Stripe…';const {data:{session}}=await supabase.auth.getSession();const response=await fetch('/api/create-vip-checkout',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},body:JSON.stringify({plan:button.dataset.plan})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.url){button.disabled=false;button.textContent=button.dataset.plan==='monthly'?'Join Monthly →':'Join Annual →';alert(data.error||'VIP checkout could not be started.');return}location.assign(data.url);}));
  }else{
    statusEl.textContent=membership.status==='trialing'?'VIP trial active':'VIP active';
    const {data:offers,error}=await supabase.from('vip_offers').select('offer_id,title,category,description,display_price,image_url,starts_at,ends_at,sort_order').order('sort_order');
    const paidMember=!!membership.stripe_subscription_id;
    const giftBlock=paidMember && membership.welcome_gift_status!=='sent' ? '<div class="card" style="margin-bottom:18px"><small>VIP WELCOME ITEM</small><h3>Where should we send your TRV welcome item?</h3><p>Your item may be a T-shirt, hat, cup/tumbler, or another TRV-branded travel/lifestyle item. The exact item varies.</p><form id="giftForm"><input name="name" placeholder="Full name" required style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px"><input name="address1" placeholder="Street address" required style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px"><input name="address2" placeholder="Apt / suite (optional)" style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px"><div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px"><input name="city" placeholder="City" required style="padding:10px;border:1px solid #ddd;border-radius:8px"><input name="state" placeholder="State" required style="padding:10px;border:1px solid #ddd;border-radius:8px"><input name="postal_code" placeholder="ZIP" required style="padding:10px;border:1px solid #ddd;border-radius:8px"></div><input name="size" placeholder="T-shirt size (optional)" style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px"><textarea name="note" placeholder="Delivery note (optional)" style="width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px"></textarea><button class="btn" type="submit" style="border:0;cursor:pointer">Save Welcome Gift Details</button><p id="giftMsg" class="muted"></p></form></div>' : (paidMember ? '<div class="card" style="margin-bottom:18px"><h3>TRV welcome item</h3><p>Your welcome item has been marked as sent. 💜</p></div>' : '');
    if(error||!offers||offers.length===0) content.innerHTML=giftBlock+'<div class="locked"><h2>Your VIP access is active.</h2><p class="muted">New member-only offers are being prepared. Check back soon.</p></div>';
    else content.innerHTML=giftBlock+'<div class="grid">'+offers.map(o=>'<article class="card">'+(o.image_url?'<img src="'+esc(o.image_url)+'" alt="" style="width:100%;border-radius:12px;margin-bottom:12px">':'')+'<small>'+esc(o.category)+'</small><h3>'+esc(o.title)+'</h3><p>'+esc(o.description||'')+'</p>'+(o.display_price?'<div class="price">'+esc(o.display_price)+'</div>':'')+'<button class="btn vip-offer-button" data-offer-id="'+esc(o.offer_id)+'" type="button" style="border:0;cursor:pointer">Open VIP Offer →</button></article>').join('')+'</div>';
    document.querySelectorAll('.vip-offer-button').forEach(button=>button.addEventListener('click',async()=>{button.disabled=true;button.textContent='Opening…';const {data,error}=await supabase.functions.invoke('vip-offer-redirect',{body:{offer_id:button.dataset.offerId}});if(error||!data?.url){button.disabled=false;button.textContent='Open VIP Offer →';alert(data?.error||'This VIP offer could not be opened.');return}location.assign(data.url);}));
    document.getElementById('giftForm')?.addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),msg=document.getElementById('giftMsg');button.disabled=true;button.textContent='Saving…';const values=Object.fromEntries(new FormData(form).entries());const {data:{session}}=await supabase.auth.getSession();const response=await fetch('/api/update-vip-gift',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},body:JSON.stringify(values)});const data=await response.json().catch(()=>({}));if(!response.ok){msg.textContent=data.error||'Gift details could not be saved.';button.disabled=false;button.textContent='Save Welcome Gift Details';return}msg.textContent='Gift details saved ✓';button.textContent='Saved ✓';});
  }
}
</script></body></html>

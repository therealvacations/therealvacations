<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Profile | The Real Vacations</title><link rel="icon" href="/favicon.ico"/>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f4f8;color:#251b30;font-family:"Segoe UI",Arial,sans-serif}nav{background:#1a0533;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}nav img{height:46px}.links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.links a,.links button{color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:none;border:0;cursor:pointer}.wrap{max-width:760px;margin:auto;padding:42px 22px}.card{background:#fff;border:1px solid #e3d9ec;border-radius:20px;padding:28px;box-shadow:0 12px 30px rgba(40,20,60,.07)}h1{margin:0 0 8px;color:#1a0533}.lead{color:#6e6278;margin:0 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #cfc4d9;border-radius:10px;font:inherit}.button{border:0;border-radius:999px;background:#7c3aed;color:#fff;padding:13px 22px;font-weight:800;cursor:pointer}.message{margin-top:14px;font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.secondary{display:inline-block;background:#efe8f7;color:#1a0533;padding:12px 18px;border-radius:999px;font-weight:800;text-decoration:none}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head>
<body><nav><a href="/my-trips"><img src="/newtrv180x180no bckgrd logo favi.jpg" alt="The Real Vacations"></a><div class="links"><a href="/my-trips">Member Home</a><a href="/my-trips#travel-groups">My Trips</a><a href="/request-travel">Request a Trip</a><a href="/member-book">Search & Book</a><a href="/update-payment-method">Payment Method</a><button id="logout">Logout</button></div></nav>
<main class="wrap"><section class="card"><h1>My Profile</h1><p class="lead">Keep your contact details current so trip requests, quotes and confirmations stay connected to the right account.</p>
<form id="profileForm"><div class="grid"><div class="field"><label for="first">First name</label><input id="first" required></div><div class="field"><label for="last">Last name</label><input id="last" required></div><div class="field"><label for="phone">Phone</label><input id="phone" type="tel"></div><div class="field"><label for="email">Email</label><input id="email" type="email" disabled></div><div class="field"><label for="city">City</label><input id="city"></div><div class="field"><label for="state">State</label><input id="state"></div></div>
<button class="button" id="save" type="submit">Save Profile</button><div class="message" id="msg"></div></form>
<div class="actions"><a class="secondary" href="/update-payment-method">Manage Payment Method</a><a class="secondary" href="/request-travel">Request a Trip</a></div></section></main>
<script type="module">
import { supabase } from '/js/supabase-client.js';
import { handleLogout } from '/js/auth.js';
const {data:{user}}=await supabase.auth.getUser();
if(!user){location.replace('/login?next='+encodeURIComponent('/member-profile'));}
else{
  document.getElementById('email').value=user.email||'';
  const {data,error}=await supabase.from('users').select('first_name,last_name,phone,city,state').eq('user_id',user.id).maybeSingle();
  if(error) document.getElementById('msg').textContent='Profile could not be loaded.';
  if(data){first.value=data.first_name||'';last.value=data.last_name||'';phone.value=data.phone||'';city.value=data.city||'';state.value=data.state||'';}
}
document.getElementById('profileForm').addEventListener('submit',async e=>{
 e.preventDefault(); const btn=document.getElementById('save'),msg=document.getElementById('msg'); btn.disabled=true;msg.textContent='';
 const {data:{user}}=await supabase.auth.getUser(); if(!user){location.replace('/login?next='+encodeURIComponent('/member-profile'));return;}
 const payload={first_name:first.value.trim(),last_name:last.value.trim(),phone:phone.value.trim()||null,city:city.value.trim()||null,state:state.value.trim()||null,updated_at:new Date().toISOString()};
 const {error}=await supabase.from('users').update(payload).eq('user_id',user.id);
 msg.textContent=error?'Unable to save profile: '+error.message:'Profile updated successfully.'; btn.disabled=false;
});
document.getElementById('logout').onclick=()=>handleLogout();
</script></body></html>

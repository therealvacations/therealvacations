<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin Login | The Real Vacations</title><link rel="icon" href="/favicon.ico"/>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#0f0620,#261042);color:#fff;font-family:"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:24px}.login-card{width:min(460px,100%);background:#1a0533;border:1px solid rgba(192,132,252,.25);border-radius:24px;padding:38px;box-shadow:0 28px 80px rgba(0,0,0,.45)}.logo{display:block;margin:0 auto 24px;max-height:64px;max-width:210px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:#c084fc;font-size:12px;font-weight:800;text-align:center}.login-card h1{text-align:center;margin:10px 0;font-size:30px}.intro{text-align:center;color:#cab8dc;margin:0 0 28px;line-height:1.5}.field{margin-bottom:18px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(192,132,252,.4);background:#0f0620;color:#fff;font-size:16px}.field input:focus{outline:3px solid rgba(124,58,237,.35);border-color:#a78bfa}.submit{width:100%;padding:14px;border:0;border-radius:11px;background:#7c3aed;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.message{display:none;margin:18px 0 0;padding:12px;border-radius:10px;font-size:14px}.message.error{display:block;background:#451a25;color:#fecdd3}.message.success{display:block;background:#123c2b;color:#bbf7d0}.back{display:block;text-align:center;color:#c4b5fd;margin-top:22px;text-decoration:none;font-size:14px}</style></head>
<body><main class="login-card"><a href="/"><img class="logo" src="/logo.jpeg" alt="The Real Vacations"/></a><div class="eyebrow">Authorized access</div><h1>Content Admin</h1><p class="intro">Manage group trips, Resources, and Blog content.</p><form id="adminLoginForm"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required/></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required/></div><button class="submit" id="loginButton" type="submit">Sign in</button><div class="message" id="loginMessage" role="status"></div></form><a class="back" href="/">← Return to the website</a></main>
<script type="module">import{supabase}from'/js/supabase-client.js';const form=document.querySelector('#adminLoginForm'),message=document.querySelector('#loginMessage'),button=document.querySelector('#loginButton'),params=new URLSearchParams(location.search);if(params.get('denied')){message.className='message error';message.textContent='This account is not authorized for the admin portal.'}const{data:{session}}=await supabase.auth.getSession();if(session){const{data}=await supabase.from('admin_users').select('id').eq('id',session.user.id).maybeSingle();if(data)location.replace('/admin')}form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;button.textContent='Verifying…';message.className='message';message.textContent='';const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value,{data,error}=await supabase.auth.signInWithPassword({email,password});if(error){message.className='message error';message.textContent='Email or password was not accepted.';button.disabled=false;button.textContent='Sign in';return}const{data:admin,error:adminError}=await supabase.from('admin_users').select('id').eq('id',data.user.id).maybeSingle();if(adminError||!admin){await supabase.auth.signOut();message.className='message error';message.textContent='This account is not authorized for the admin portal.';button.disabled=false;button.textContent='Sign in';return}message.className='message success';message.textContent='Access confirmed. Opening the admin portal…';location.replace('/admin')})</script></body></html>

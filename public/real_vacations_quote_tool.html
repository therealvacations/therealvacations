<script>
/* ──────────────────────────────────────────
   STATE
────────────────────────────────────────── */
let hotels = [
{
  id:1,
  name:'Hilton San Francisco Financial District',
  location:'San Francisco, CA',
  checkIn:'Jun 18',
  checkOut:'Jun 19',
  nights:1,
  room:'Deluxe Room, 2 Double Beds, City View',
  base:207,
  expedia:244,
  cancel:'non-refundable',
  photo:'',
  notes:''
},
{
  id:2,
  name:'The Meritage Resort & Spa',
  location:'Napa Valley, CA',
  checkIn:'Jun 19',
  checkOut:'Jun 21',
  nights:2,
  room:'Room, 1 King Bed, Accessible',
  base:1536,
  expedia:2371,
  cancel:'non-refundable',
  photo:'',
  notes:''
}
];

let nextId = 3;

/* ──────────────────────────────────────────
   HELPERS
────────────────────────────────────────── */
function fmt(n){
  return '$' + Math.round(Number(n || 0)).toLocaleString();
}

function sanitize(str=''){
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function calcQuote(h, markup){
  const base = Number(h.base || 0);
  const exp = Number(h.expedia || 0);
  const marked = base * (1 + markup / 100);
  if(exp <= 0) return Math.max(0, marked);
  return Math.max(0, Math.min(marked, exp - 1));
}

/* ──────────────────────────────────────────
   SECTION TOGGLE
────────────────────────────────────────── */
function toggleSection(head){
  head.classList.toggle('collapsed');
  head.nextElementSibling.classList.toggle('hidden');
}

/* ──────────────────────────────────────────
   HOTEL CRUD
────────────────────────────────────────── */
function addHotel(){
  hotels.push({
    id: nextId++,
    name:'Hotel Name',
    location:'City, State',
    checkIn:'',
    checkOut:'',
    nights:1,
    room:'Room Type',
    base:0,
    expedia:0,
    cancel:'non-refundable',
    photo:'',
    notes:''
  });
  update();
}

function removeHotel(id){
  if(hotels.length === 1){
    alert('At least one hotel is required.');
    return;
  }
  hotels = hotels.filter(h => h.id !== id);
  update();
}

function updateHotel(id, field, value){
  const hotel = hotels.find(h => h.id === id);
  if(!hotel) return;
  if(['base','expedia','nights'].includes(field)){
    hotel[field] = Number(value) || 0;
  } else {
    hotel[field] = value;
  }
  update();
}

/* ──────────────────────────────────────────
   HOTEL EDITOR
────────────────────────────────────────── */
function renderHotels(){
  const container = document.getElementById('hotelsContainer');
  const markup = Number(document.getElementById('markupSlider').value || 0);
  container.innerHTML = '';

  hotels.forEach((h, index) => {
    const quote = calcQuote(h, markup);
    const profit = quote - h.base;
    const saved = Math.max(0, h.expedia - quote);

    const card = document.createElement('div');
    card.className = 'hotel-editor';

    card.innerHTML = `
      <div class="hotel-editor-head">
        <span class="hotel-num">Hotel ${index + 1}</span>
        <button class="btn-remove" onclick="removeHotel(${h.id})">
          ✕ Remove
        </button>
      </div>

      ${h.photo ? `
        <img
          class="photo-preview show"
          src="${sanitize(h.photo)}"
          onerror="this.style.display='none'"
        >
      ` : ''}

      <div class="field-grid full" style="margin-bottom:8px;">
        <div class="field">
          <label>Hotel Name</label>
          <input
            type="text"
            value="${sanitize(h.name)}"
            oninput="updateHotel(${h.id},'name',this.value)"
          >
        </div>
      </div>

      <div class="field-grid" style="margin-bottom:8px;">
        <div class="field">
          <label>Location</label>
          <input
            type="text"
            value="${sanitize(h.location)}"
            oninput="updateHotel(${h.id},'location',this.value)"
          >
        </div>
        <div class="field">
          <label>Nights</label>
          <input
            type="number"
            min="1"
            value="${h.nights}"
            oninput="updateHotel(${h.id},'nights',this.value)"
          >
        </div>
      </div>

      <div class="field-grid" style="margin-bottom:8px;">
        <div class="field">
          <label>Base Price</label>
          <input
            type="number"
            value="${h.base}"
            oninput="updateHotel(${h.id},'base',this.value)"
          >
        </div>
        <div class="field">
          <label>Expedia Price</label>
          <input
            type="number"
            value="${h.expedia}"
            oninput="updateHotel(${h.id},'expedia',this.value)"
          >
        </div>
      </div>

      <div class="hotel-calc">
        <div class="calc-item">
          <div class="calc-lbl">Quote</div>
          <div class="calc-val">${fmt(quote)}</div>
        </div>
        <div class="calc-item">
          <div class="calc-lbl">Client Saves</div>
          <div class="calc-val green">${fmt(saved)}</div>
        </div>
        <div class="calc-item">
          <div class="calc-lbl">Profit</div>
          <div class="calc-val blue">${fmt(profit)}</div>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

/* ──────────────────────────────────────────
   DOCUMENT RENDER
────────────────────────────────────────── */
function renderDoc(){
  const markup = Number(document.getElementById('markupSlider').value || 0);

  let totalQuote = 0;
  let totalExpedia = 0;
  let totalProfit = 0;

  const output = hotels.map((h, i) => {
    const quote = calcQuote(h, markup);
    const saved = Math.max(0, h.expedia - quote);
    const profit = quote - h.base;

    totalQuote += quote;
    totalExpedia += h.expedia;
    totalProfit += profit;

    return `
      <div class="doc-hotel">
        ${h.photo ? `
          <img
            class="doc-hotel-img show"
            src="${sanitize(h.photo)}"
            onerror="this.style.display='none'"
          >
        ` : ''}
        <div class="doc-hotel-content">
          <div class="doc-hotel-badge">Hotel ${i + 1}</div>
          <div class="doc-hotel-name">${sanitize(h.name)}</div>
          <div class="doc-hotel-sub">${sanitize(h.location)}</div>
          <div class="doc-price-row">
            <span class="doc-price-lbl">Expedia Rate</span>
            <span class="doc-price-val cross">${fmt(h.expedia)}</span>
          </div>
          <div class="doc-price-row">
            <span class="doc-price-lbl">Your Quote</span>
            <span class="doc-price-val quote-price">${fmt(quote)}</span>
          </div>
          <div class="doc-price-row">
            <span class="doc-price-lbl">Savings</span>
            <span class="doc-price-val saved">${fmt(saved)}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('docHotels').innerHTML = output;
  document.getElementById('sumTotal').textContent = fmt(totalQuote);
  document.getElementById('sumSaved').textContent = fmt(totalExpedia - totalQuote);
  document.getElementById('sumProfit').textContent = fmt(totalProfit);
}

/* ──────────────────────────────────────────
   COPY
────────────────────────────────────────── */
function flash(){
  const el = document.getElementById('copiedMsg');
  el.classList.add('show');
  setTimeout(() => { el.classList.remove('show'); }, 2000);
}

async function copyEmail(){
  try{
    await navigator.clipboard.writeText(
      document.getElementById('text-quote').value
    );
    flash();
  } catch(err){
    alert('Clipboard copy failed.');
  }
}

/* ──────────────────────────────────────────
   SAVE / LOAD
────────────────────────────────────────── */
function saveQuote(){
  localStorage.setItem('trv-quote', JSON.stringify({
    hotels,
    nextId,
    markup: document.getElementById('markupSlider').value
  }));
  setSaved(true);
}

function loadQuote(){
  const raw = localStorage.getItem('trv-quote');
  if(!raw){
    alert('No saved quote found.');
    return;
  }
  try{
    const data = JSON.parse(raw);
    hotels = data.hotels || hotels;
    nextId = data.nextId || nextId;
    if(data.markup !== undefined){
      document.getElementById('markupSlider').value = data.markup;
    }
    update();
    setSaved(true);
  } catch(err){
    alert('Save file corrupted.');
  }
}

/* ──────────────────────────────────────────
   SAVE STATUS
────────────────────────────────────────── */
function setSaved(saved){
  document.getElementById('save-dot').className = 'save-dot' + (saved ? ' saved' : '');
  document.getElementById('save-label').textContent = saved ? 'Saved' : 'Unsaved';
}

/* ──────────────────────────────────────────
   MAIN UPDATE
────────────────────────────────────────── */
function update(){
  renderHotels();
  renderDoc();
  setSaved(false);
}

/* ──────────────────────────────────────────
   INIT
────────────────────────────────────────── */
update();
</script>

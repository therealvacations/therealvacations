# Staging migration. Do not associate production domain until payment flow is verified.
[build]
  command = "node build-nav-safe.js"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Netlify functions replace Vercel's /api serverless routes.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true


[[headers]]
  for = "/*"
  [headers.values]
  "X-Content-Type-Options" = "nosniff"
  [headers.values]
  "X-Frame-Options" = "SAMEORIGIN"
  [headers.values]
  "Referrer-Policy" = "strict-origin-when-cross-origin"
  [headers.values]
  "Permissions-Policy" = "camera=(), microphone=(), geolocation=(), payment=(self)"
  [headers.values]
  "Content-Security-Policy" = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https://flights.therealvacations.com https://www.youtube.com https://js.stripe.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests"
